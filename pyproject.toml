[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bohnasa"
version = "0.1.0.dev1"
description = "Exact diagonalization tools for quantum many-body systems"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mathias Steinhuber" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "scipy-stubs"]
examples = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/mattlST/bohnasa"

[tool.setuptools]
packages = ["bohnasa"]

[tool.ruff]
target-version = "py310"
line-length = 100
# notebooks are converted to tests/examples in Phase 4; linting them meanwhile
# fails on stale scratch cells (e.g. t03)
extend-exclude = ["**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T"]

[tool.ruff.lint.per-file-ignores]
# the package API is deliberately re-exported via star imports
"bohnasa/__init__.py" = ["F401", "F403"]
# demo scripts print on purpose
"examples/*.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
